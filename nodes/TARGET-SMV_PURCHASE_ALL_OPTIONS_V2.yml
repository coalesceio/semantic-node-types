          dimSynonym: purchased on
          dimTransform: ""
        - dimAlias: purchaseWeekday
          dimCol:
            columnCounter: 4fff59be-360a-41d3-86d3-50a755c37179
            name: phPurchaseDate
            stepCounter: 6e796d49-8140-49ed-868a-a729549e38dc
          dimComment: Day of the week of the purchase
          dimSynonym: weekday, day of week
          dimTransform: DAYNAME("Header"."phPurchaseDate")
        - dimAlias: PURCHASE_DETAIL.unitsBucket
          dimCol:
            columnCounter: 39c0a8ef-c8b5-440d-844f-007997639bd4
            name: PD_UNITS
            stepCounter: 6e796d49-8140-49ed-868a-a729549e38dc
          dimComment: Bulk when a line has 10 or more units
          dimSynonym: order size, bulk flag
          dimTransform: CASE WHEN "PURCHASE_DETAIL"."PD_UNITS" >= 10 THEN 'Bulk' ELSE 'Single' END
    aiQuestionCategorization: This view covers purchases by people across item groups and weekdays. Ask a clarifying question when the user does not say whether they mean units or purchases.
    aiSqlGeneration: Use the unitsBucket dimension for any question about bulk or single orders. Use distinctBuyers instead of counting people directly. Sort weekdays Monday to Sunday.
    aiVerifiedQueries:
      items:
        - name: bulk_vs_single_units
          question: How do bulk and single orders compare by units?
          sql: SELECT d."unitsBucket", SUM(d."PD_UNITS") AS total_units FROM "__PURCHASE_DETAIL" AS d GROUP BY d."unitsBucket"
          useAsOnboardingQuestion: true
          verifiedAt: "1759881600"
          verifiedBy: anandhi.sekaran
        - name: buyers_by_weekday
          question: How many distinct buyers purchase on each weekday?
          sql: SELECT h."purchaseWeekday", COUNT(DISTINCT h."phPersonId") AS distinct_buyers FROM "__Header" AS h GROUP BY h."purchaseWeekday"
          useAsOnboardingQuestion: true
          verifiedAt: ""
          verifiedBy: anandhi.sekaran
        - name: avg_cost_by_group
          question: What's the average item cost in cents for each item group?
          sql: SELECT i."ItemGroup", AVG(i."costCents") AS avg_cost_cents FROM "__ITEM_CATALOG" AS i GROUP BY i."ItemGroup" ORDER BY avg_cost_cents DESC
          useAsOnboardingQuestion: false
          verifiedAt: "1759881600"
          verifiedBy: ""
    aiVerifiedQueriesEnabled: true
    deriveCol: false
    dimToggle: true
