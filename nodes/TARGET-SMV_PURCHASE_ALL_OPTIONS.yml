    aiQuestionCategorization: Answer questions about purchases, purchased units, items and the people who bought them. Reject questions about pricing strategy, suppliers or employees.
    aiSqlGeneration: Treat units as whole numbers. Round costs to 2 decimal places. When the user says customer, use the people table. Default to grouping by region when no grouping is given.
    aiVerifiedQueries:
      items:
        - name: units_by_region
          question: What is each region's total number of units purchased?
          sql: SELECT p."region", SUM(d."units") AS total_units FROM "__purchaseDetail" AS d JOIN "__purchaseHeader" AS h ON d.PD_PURCHASE_ID = h."phPurchaseId" JOIN "__people" AS p ON h."phPersonId" = p.PM_PERSON_ID GROUP BY p."region" ORDER BY total_units DESC
          useAsOnboardingQuestion: true
          verifiedAt: "1759795200"
          verifiedBy: anandhi.sekaran
        - name: units_by_item_group
          question: Which item groups sold the most units?
          sql: SELECT i.IC_ITEM_GROUP, SUM(d."units") AS total_units FROM "__purchaseDetail" AS d JOIN "__items" AS i ON d.PD_ITEM_ID = i.IC_ITEM_ID GROUP BY i.IC_ITEM_GROUP ORDER BY total_units DESC
          useAsOnboardingQuestion: false
          verifiedAt: "1759795200"
          verifiedBy: anandhi.sekaran
        - name: purchases_per_year
          question: How many purchases were made each year?
          sql: SELECT h."purchaseYear", COUNT(h."phPurchaseId") AS purchase_count FROM "__purchaseHeader" AS h GROUP BY h."purchaseYear" ORDER BY h."purchaseYear"
          useAsOnboardingQuestion: false
          verifiedAt: ""
          verifiedBy: ""
