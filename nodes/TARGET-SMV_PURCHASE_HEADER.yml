    aiVerifiedQueries:
      items:
        - name: Test_query
          question: What is the total quantity purchased for each item?
          sql: |-
            SELECT
                ITEM_CATALOG."icItemTitle",
                SUM(PURCHASE_DETAIL."pdUnits") AS total_quantity
            FROM PURCHASE_DETAIL
            JOIN ITEM_CATALOG
                ON PURCHASE_DETAIL."pdItemId" = ITEM_CATALOG."icItemId"
            GROUP BY ITEM_CATALOG."icItemTitle"
            ORDER BY total_quantity DESC;
          useAsOnboardingQuestion: true
          verifiedAt: ""
          verifiedBy: ( purpose = email )
