    aiQuestionCategorization: Only answer questions about sales, customers and dates. Politely decline questions about inventory, employees or suppliers.
    aiSqlGeneration: Round all monetary values to 2 decimal places. When a question mentions a quarter, use the sale_quarter dimension. Always order results by the main metric in descending order.
    aiVerifiedQueries:
      items:
        - name: total_sales_overall
          question: What is the total sales amount?
          sql: SELECT SUM(s."sale_amount") AS total_sales FROM __sales AS s
          useAsOnboardingQuestion: true
          verifiedAt: "1759708800"
          verifiedBy: anandhi.sekaran
        - name: sales_by_customer
          question: What is the total sales amount for each customer?
          sql: SELECT c."customer_name", SUM(s."sale_amount") AS total_sales FROM __sales AS s JOIN __customers AS c ON s.sale_customer_id = c.customer_id GROUP BY c."customer_name" ORDER BY total_sales DESC
          useAsOnboardingQuestion: true
          verifiedAt: "1759708800"
          verifiedBy: anandhi.sekaran
        - name: sales_by_year_month
          question: How many sales were made in each year and month?
          sql: SELECT d."sale_year", d.month, COUNT(s.sale_id) AS sales_count FROM __sales AS s JOIN __dates AS d ON s.sale_date_id = d.date_id GROUP BY d."sale_year", d.month ORDER BY d."sale_year", d.month
          useAsOnboardingQuestion: false
          verifiedAt: ""
          verifiedBy: ""
